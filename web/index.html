<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Torn Market Scanner</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <header>
    <div>
      <h1>Torn Market Scanner</h1>
      <p>V0.1 · localhost proof-of-concept</p>
    </div>
    <span id="status">Checking…</span>
  </header>

  <section class="panel">
    <h2>API Key</h2>
    <p class="muted">V0.1 keeps the key in RAM only. Restarting the server forgets it.</p>
    <div class="row">
      <input id="key" type="password" placeholder="Paste a fresh LIMITED Torn API key">
      <button onclick="loadKey()">Load Key</button>
      <button class="secondary" onclick="forgetKey()">Forget</button>
    </div>
    <div id="msg"></div>
  </section>

  <section class="toolbar">
    <button onclick="refreshMarket()">Refresh Xanax</button>
    <label><input id="auto" type="checkbox" onchange="toggleAuto()"> Auto-refresh 30 sec</label>
    <button class="secondary" onclick="window.open(marketUrl,'_blank')">Open Market</button>
  </section>

  <section class="cards">
    <div class="card"><span>Lowest</span><strong id="low">—</strong><small id="qty">—</small></div>
    <div class="card"><span>Next Higher</span><strong id="next">—</strong><small>first price above floor</small></div>
    <div class="card"><span>Net After 5% Fee</span><strong id="profit">—</strong><small id="roi">—</small></div>
  </section>

  <section class="panel">
    <h2>Top Listings</h2>
    <table>
      <thead><tr><th>#</th><th>Price</th><th>Qty</th></tr></thead>
      <tbody id="rows"><tr><td colspan="3" class="muted">Load a key and refresh.</td></tr></tbody>
    </table>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
